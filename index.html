<!doctype html>
<html lang="en" style="background-color: #0e1621; color: #ffffff;">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0e1621" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0e1621" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Telegram" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Apple Touch Startup Splash Screens to eliminate iOS PWA launch white flash -->
    <link rel="apple-touch-startup-image" href="/icons/splash-dark.png" />
    <link rel="apple-touch-startup-image" href="/icons/splash-dark.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-dark.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-dark.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-dark.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-dark.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />

    <!-- Instant critical dark surface CSS (rendered in 0ms before any external network asset) -->
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        background-color: #0e1621 !important;
        background: #0e1621 !important;
        color: #ffffff;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        background-color: #0e1621;
        min-height: 100%;
        height: 100%;
        width: 100%;
      }
      .tg-shell-shimmer {
        animation: tgShimmer 1.5s infinite linear;
        background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
        background-size: 200% 100%;
      }
      @keyframes tgShimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>

    <!-- Synchronous stored theme check -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('tg_theme') || localStorage.getItem('theme');
          var bg = '#0e1621';
          if (t === 'light' || t === 'day' || t === 'arctic') bg = '#ffffff';
          document.documentElement.style.backgroundColor = bg;
        } catch(e) {}
      })();
    </script>

    <title>Telegram Web</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Non-blocking asynchronous font loading (does NOT block initial dark skeleton paint) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Battambang:wght@300;400;700;900&family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Battambang:wght@300;400;700;900&family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body style="background-color: #0e1621; color: #ffffff;" class="bg-tg-bg text-tg-text font-sans antialiased">
    <div id="root">
      <div style="display:flex;flex-direction:column;height:100vh;background-color:#0e1621;color:#fff;overflow:hidden;user-select:none;">
        <!-- Top App Header -->
        <div style="display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top, 12px) + 8px) 16px 8px;border-bottom:1px solid rgba(255,255,255,0.06);">
          <div style="width:36px;height:24px;border-radius:12px;background:rgba(255,255,255,0.08);"></div>
          <div style="font-size:17px;font-weight:600;letter-spacing:-0.2px;">Chats</div>
          <div style="width:24px;height:24px;border-radius:12px;background:rgba(255,255,255,0.08);"></div>
        </div>
        <!-- Search bar skeleton -->
        <div style="padding:8px 16px;">
          <div class="tg-shell-shimmer" style="height:36px;border-radius:10px;background:rgba(255,255,255,0.06);width:100%;"></div>
        </div>
        <!-- Folder Pills row -->
        <div style="display:flex;gap:8px;padding:4px 16px 10px;border-bottom:1px solid rgba(255,255,255,0.04);">
          <div style="height:28px;width:44px;border-radius:14px;background:rgba(42,130,218,0.25);"></div>
          <div style="height:28px;width:64px;border-radius:14px;background:rgba(255,255,255,0.06);"></div>
          <div style="height:28px;width:60px;border-radius:14px;background:rgba(255,255,255,0.06);"></div>
          <div style="height:28px;width:68px;border-radius:14px;background:rgba(255,255,255,0.06);"></div>
        </div>
        <!-- Chat Rows List -->
        <div style="flex:1;overflow:hidden;padding:4px 16px;display:flex;flex-direction:column;gap:16px;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div class="tg-shell-shimmer" style="width:52px;height:52px;border-radius:26px;flex-shrink:0;"></div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;">
              <div style="display:flex;justify-content:space-between;">
                <div class="tg-shell-shimmer" style="width:40%;height:14px;border-radius:4px;"></div>
                <div class="tg-shell-shimmer" style="width:12%;height:12px;border-radius:4px;"></div>
              </div>
              <div class="tg-shell-shimmer" style="width:70%;height:12px;border-radius:4px;"></div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;">
            <div class="tg-shell-shimmer" style="width:52px;height:52px;border-radius:26px;flex-shrink:0;"></div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;">
              <div style="display:flex;justify-content:space-between;">
                <div class="tg-shell-shimmer" style="width:48%;height:14px;border-radius:4px;"></div>
                <div class="tg-shell-shimmer" style="width:12%;height:12px;border-radius:4px;"></div>
              </div>
              <div class="tg-shell-shimmer" style="width:60%;height:12px;border-radius:4px;"></div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;">
            <div class="tg-shell-shimmer" style="width:52px;height:52px;border-radius:26px;flex-shrink:0;"></div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;">
              <div style="display:flex;justify-content:space-between;">
                <div class="tg-shell-shimmer" style="width:36%;height:14px;border-radius:4px;"></div>
                <div class="tg-shell-shimmer" style="width:12%;height:12px;border-radius:4px;"></div>
              </div>
              <div class="tg-shell-shimmer" style="width:80%;height:12px;border-radius:4px;"></div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;">
            <div class="tg-shell-shimmer" style="width:52px;height:52px;border-radius:26px;flex-shrink:0;"></div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;">
              <div style="display:flex;justify-content:space-between;">
                <div class="tg-shell-shimmer" style="width:55%;height:14px;border-radius:4px;"></div>
                <div class="tg-shell-shimmer" style="width:12%;height:12px;border-radius:4px;"></div>
              </div>
              <div class="tg-shell-shimmer" style="width:65%;height:12px;border-radius:4px;"></div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;">
            <div class="tg-shell-shimmer" style="width:52px;height:52px;border-radius:26px;flex-shrink:0;"></div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;">
              <div style="display:flex;justify-content:space-between;">
                <div class="tg-shell-shimmer" style="width:42%;height:14px;border-radius:4px;"></div>
                <div class="tg-shell-shimmer" style="width:12%;height:12px;border-radius:4px;"></div>
              </div>
              <div class="tg-shell-shimmer" style="width:50%;height:12px;border-radius:4px;"></div>
            </div>
          </div>
        </div>
        <!-- Bottom Tab Bar -->
        <div style="display:flex;align-items:center;justify-content:space-around;padding:10px 16px calc(env(safe-area-inset-bottom, 16px) + 8px);border-top:1px solid rgba(255,255,255,0.06);background:#17212b;">
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div style="width:24px;height:24px;border-radius:12px;background:rgba(42,130,218,0.8);"></div>
            <div style="width:28px;height:8px;border-radius:4px;background:rgba(42,130,218,0.8);"></div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div style="width:24px;height:24px;border-radius:12px;background:rgba(255,255,255,0.15);"></div>
            <div style="width:28px;height:8px;border-radius:4px;background:rgba(255,255,255,0.15);"></div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div style="width:24px;height:24px;border-radius:12px;background:rgba(255,255,255,0.15);"></div>
            <div style="width:28px;height:8px;border-radius:4px;background:rgba(255,255,255,0.15);"></div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div style="width:24px;height:24px;border-radius:12px;background:rgba(255,255,255,0.15);"></div>
            <div style="width:28px;height:8px;border-radius:4px;background:rgba(255,255,255,0.15);"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
