<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Senior UI/UX Designer">
  <defs>
    <linearGradient id="ui-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="skin-ui" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdfd3"/>
      <stop offset="100%" stop-color="#f0b8a4"/>
    </linearGradient>
    <linearGradient id="hair-ui" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#ui-bg)"/>

  <!-- UI/UX Grid Pattern Background Elements -->
  <g opacity="0.18" stroke="#ffffff" stroke-width="1.5">
    <rect x="20" y="20" width="48" height="32" rx="4" fill="none"/>
    <circle cx="100" cy="36" r="14" fill="none"/>
    <rect x="180" y="20" width="56" height="60" rx="6" fill="none"/>
    <line x1="20" y1="70" x2="140" y2="70" stroke-dasharray="4 4"/>
  </g>

  <!-- Body / Clothes -->
  <path d="M48 256 C52 200 80 185 128 185 C176 185 204 200 208 256 Z" fill="#18181b"/>
  <path d="M100 185 L128 215 L156 185 Z" fill="#f43f5e"/>

  <!-- Neck -->
  <rect x="114" y="145" width="28" height="42" rx="4" fill="url(#skin-ui)"/>

  <!-- Hair Back -->
  <ellipse cx="128" cy="120" rx="72" ry="76" fill="url(#hair-ui)"/>

  <!-- Head Base -->
  <ellipse cx="128" cy="116" rx="50" ry="56" fill="url(#skin-ui)"/>

  <!-- Stylish Bob Hair Cut -->
  <path d="M74 105 C74 50 182 50 182 105 C182 150 172 165 168 150 C162 90 148 76 128 76 C104 76 92 90 88 150 C84 165 74 150 74 105 Z" fill="url(#hair-ui)"/>

  <!-- Cute Eyes -->
  <ellipse cx="108" cy="118" rx="6.5" ry="8" fill="#1e1b4b"/>
  <ellipse cx="148" cy="118" rx="6.5" ry="8" fill="#1e1b4b"/>
  <circle cx="110" cy="115" r="2.5" fill="#ffffff"/>
  <circle cx="150" cy="115" r="2.5" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M98 104 Q108 100 118 105" fill="none" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M138 105 Q148 100 158 104" fill="none" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Blush Cheeks -->
  <ellipse cx="96" cy="128" rx="10" ry="5" fill="#f43f5e" opacity="0.45"/>
  <ellipse cx="160" cy="128" rx="10" ry="5" fill="#f43f5e" opacity="0.45"/>

  <!-- Nose & Smile -->
  <path d="M126 122 Q128 126 130 122" fill="none" stroke="#e11d48" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M118 142 Q128 150 138 142" fill="none" stroke="#be123c" stroke-width="3" stroke-linecap="round"/>

  <!-- Modern Designer Glass/Badge -->
  <g transform="translate(160, 175)">
    <rect width="76" height="36" rx="10" fill="url(#glass)" stroke="#ffffff" stroke-width="1.5" backdrop-filter="blur(8px)"/>
    <text x="38" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">UI / UX</text>
  </g>
</svg>
