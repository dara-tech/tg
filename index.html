<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0e1621" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0e1621" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Telegram" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Apple Touch Startup Splash Screens to eliminate iOS PWA launch white flash -->
    <link rel="apple-touch-startup-image" href="/icons/splash-dark.png" />
    <link rel="apple-touch-startup-image" href="/icons/splash-dark.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-dark.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-dark.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-dark.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-dark.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />

    <!-- Instant critical dark surface CSS (rendered in 0ms before any external network asset) -->
    <style>
      :root {
        color-scheme: dark;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        background-color: #0e1621;
        background: #0e1621;
        color: #ffffff;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        background-color: #0e1621;
        min-height: 100%;
        height: 100%;
        width: 100%;
      }
      html[data-theme],
      html[data-theme] body,
      html[data-theme] #root {
        background-color: var(--tg-bg) !important;
        background: var(--tg-bg) !important;
        color: var(--tg-text);
      }
      @keyframes tgSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes tgPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.92; }
      }
    </style>

    <!-- Synchronous stored theme check -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('tg_theme') || localStorage.getItem('theme');
          var bg = '#0e1621';
          if (t === 'light' || t === 'day' || t === 'arctic') bg = '#ffffff';
          document.documentElement.style.backgroundColor = bg;
        } catch(e) {}
      })();
    </script>

    <title>Telegram Web</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Non-blocking asynchronous font loading (does NOT block initial dark skeleton paint) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&family=Battambang:wght@300;400;700;900&family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&family=Battambang:wght@300;400;700;900&family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body class="bg-tg-bg text-tg-text font-sans antialiased">
    <div id="root">
      <div style="position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background-color:#0e1621;user-select:none;z-index:9999;">
        <div style="position:relative;width:92px;height:92px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;">
          <!-- Circular loading animation wrapping directly around the Telegram logo -->
          <div style="position:absolute;top:0;left:0;width:92px;height:92px;border-radius:50%;box-sizing:border-box;border:3px solid rgba(255,255,255,0.08);border-top-color:#2AABEE;border-right-color:rgba(42,171,238,0.35);animation:tgSpin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
          <!-- Rounded-full Telegram Logo without any shadow -->
          <div style="width:76px;height:76px;border-radius:50%;background:#2AABEE;box-sizing:border-box;display:flex;align-items:center;justify-content:center;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" style="margin-right:2px;margin-bottom:1px;">
              <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z" fill="#ffffff"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
